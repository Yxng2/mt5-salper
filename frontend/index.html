<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAUUSD MT5 Scalper</title><style>body{font-family:Arial;background:#111;color:#eee;padding:18px} .card{background:#1d1d1d;border-radius:14px;padding:16px;margin-bottom:14px}input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:0}button{font-weight:bold}</style></head><body><h2>XAUUSD MT5 Scalper V1</h2><div class="card"><b id="status">Checking...</b><p>Paper-only by default.</p></div><div class="card"><h3>MT5 Account</h3><input id="login" placeholder="MT5 Account ID / Login"><input id="password" type="password" placeholder="MT5 Password"><input id="server" placeholder="MT5 Server"><input id="symbol" value="XAUUSD" placeholder="Gold symbol"><button onclick="save()">Save connection</button><p id="msg"></p></div><div class="card"><button onclick="toggle(true)">START (PAPER)</button><button onclick="toggle(false)">STOP</button></div><div class="card"><pre id="market">Waiting...</pre></div><script>async function j(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.detail||"Request failed");return d}async function refresh(){try{let s=await j("/state");status.textContent=s.enabled?"BOT ON (PAPER)":"BOT OFF";let p=await j("/price");market.textContent=JSON.stringify(p,null,2)}catch(e){status.textContent="Not connected";market.textContent=e.message}}async function save(){try{await j("/credentials",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:login.value,password:password.value,server:server.value,symbol:symbol.value})});msg.textContent="Connection details saved."}catch(e){msg.textContent=e.message}}async function toggle(enabled){try{await j("/bot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled})});refresh()}catch(e){alert(e.message)}}refresh();setInterval(refresh,5000)</script></body></html>
